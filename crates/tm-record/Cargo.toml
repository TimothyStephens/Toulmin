[package]
name = "tm-record"
version = "0.1.0"
description = "Toulmin Record library: main-chain segments, HEAD, the lock and epochs, the object store, event scans, and integrity checks"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rustix = { workspace = true, features = ["system"] }
serde_json.workspace = true
sha2.workspace = true
tm-formats.workspace = true
tm-fsfacts.workspace = true
tm-owner-cap.workspace = true
zstd.workspace = true

[features]
# Item 40's generator (`gen_chain`, `examples/gen-chain.rs`): the crate's
# own tests and example enable it through the dev-dependency below; a
# consumer of the library (tm-core) never sees the module.
gen-chain = []

[[example]]
name = "gen-chain"
required-features = ["gen-chain"]

[dev-dependencies]
tempfile.workspace = true
tm-record = { path = ".", version = "=0.1.0", features = ["gen-chain"] }

[lints]
workspace = true
